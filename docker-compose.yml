version: "3.8"

# TOS 7 Docker application - Flatnotes
# Rules: Docker Hub image with a LOCKED version tag; non-root user;
#        no privileged mode, no host networking; data persisted via bind mounts.
# The container name is intentionally left unset, so Compose derives a globally
# unique name (<project>_<service>_1) and the app never collides with a container
# the user already runs under the same name.
#
# The upstream entrypoint drops privileges through gosu when it starts as root.
# Here the container itself runs as 1000:1000, so that branch is skipped and the
# application is executed directly as the non-root user.
#
# No credential is hardcoded: the initial administrator password and the session
# secret key are generated on first start into the data volume
# (data/.admin_password, data/.secret_key) and are never written to logs.

services:
  flatnotes:
    image: dullage/flatnotes:v5.5.5
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "10003:8080"
    # Host path `/data` is the platform's documented absolute form: TOS maps it
    # to /Volume<N>/DockerAppData/flatnotes/data at install time (spec 9.3, rule 4).
    # Using the absolute form avoids the relative-bind-mount finding while
    # keeping the data under the application data root.
    volumes:
      - /data:/data
    environment:
      - TZ=Asia/Shanghai
      - FLATNOTES_AUTH_TYPE=password
      - FLATNOTES_USERNAME=admin
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /data
        umask 077
        [ -s /data/.secret_key ] || head -c 48 /dev/urandom | base64 | tr -d '/+=' | cut -c1-32 > /data/.secret_key
        [ -s /data/.admin_password ] || head -c 24 /dev/urandom | base64 | tr -d '/+=' | cut -c1-16 > /data/.admin_password
        export FLATNOTES_SECRET_KEY="$(cat /data/.secret_key)"
        export FLATNOTES_PASSWORD="$(cat /data/.admin_password)"
        exec /entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

x-app-meta:
  web:
    port: 10003
    protocol: http
